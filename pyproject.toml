[tool.poetry]
name = "logcraft-aop"
version = "0.1.1"
description = "AOP-style declarative logging decorators powered by loguru"
authors = [
    "Lovey Chen <loveychen@github.com>",
    "Copilot <223556219+Copilot@users.noreply.github.com>",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/loveychen/logcraft"
keywords = ["logging", "loguru", "aop", "decorator", "structured-logging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
]

packages = [{ include = "logcraft" }]

[tool.poetry.dependencies]
python = ">=3.10"
loguru = { version = ">=0.7.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
ruff = ">=0.1.0"
loguru = ">=0.7.0"

[tool.poetry.extras]
loguru = ["loguru"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
