[tool.poetry]
name = "logcraft"
version = "0.1.0"
description = "AOP-style declarative logging decorators powered by loguru"
authors = [
    "Lovey Chen <loveychen@github.com>",
    "Copilot <223556219+Copilot@users.noreply.github.com>",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/loveychen/logcraft"
keywords = ["logging", "loguru", "aop", "decorator", "structured-logging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
]

[tool.poetry.dependencies]
python = ">=3.10"
loguru = ">=0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
